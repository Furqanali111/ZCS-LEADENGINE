name: ci

on:
  pull_request:
    branches: [develop, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # Tests run on an embedded Postgres (pgserver). This URL is a placeholder, never connected to.
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql://x:y@localhost/z

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      # The desktop bundle uses the static export, so make sure it still builds.
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_API_URL: ""
