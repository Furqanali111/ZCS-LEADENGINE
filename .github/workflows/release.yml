name: release

# Push a tag like v1.2.0 (cut from release/v1.2.0) to build the Windows app and publish it.
# Teammates' copies update themselves from this release the next time they start.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI (static export, same-origin API)
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          STATIC_EXPORT=1 NEXT_PUBLIC_API_URL="" npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Build the exe
        working-directory: backend
        shell: bash
        run: |
          pip install -e . pyinstaller
          echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > app/version.py
          pyinstaller launcher.py --name zcs-leadengine --onedir --noconfirm \
            --add-data "../frontend/out;static" \
            --add-data "migrations;migrations" \
            --add-data "alembic.ini;." \
            --add-data "scoring_config.json;." \
            --collect-submodules app --collect-submodules uvicorn \
            --collect-all psycopg --collect-all psycopg_binary --collect-all ddgs
          cp .env.example dist/zcs-leadengine/.env.example

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path backend/dist/zcs-leadengine -DestinationPath "zcs-leadengine-${{ github.ref_name }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: zcs-leadengine-*.zip
          generate_release_notes: true
