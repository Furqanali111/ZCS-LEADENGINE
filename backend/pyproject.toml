[project]
name = "zcs-leadengine-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]>=3",
  "pydantic-settings",
  "httpx",
  "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "pgserver"]

[tool.setuptools]
packages = ["app", "app.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
